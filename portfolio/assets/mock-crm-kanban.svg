      <rect class="txt2" x="668" y="244" width="112" height="12" rx="4"/>
      <rect class="txt" x="650" y="278" width="166" height="10" rx="4"/>
      <rect class="goldsoft" x="650" y="298" width="88" height="20" rx="10"/>
      <rect class="card" x="630" y="346" width="212" height="112" rx="8"/>
      <rect class="txt2" x="650" y="374" width="140" height="12" rx="4"/>
      <rect class="txt" x="650" y="408" width="120" height="10" rx="4"/>
      <rect class="txt" x="650" y="430" width="150" height="10" rx="4"/>
      <rect class="card" x="630" y="476" width="212" height="112" rx="8"/>
      <rect class="txt2" x="650" y="504" width="98" height="12" rx="4"/>
      <rect class="txt" x="650" y="538" width="146" height="10" rx="4"/>
      <rect class="txt" x="650" y="560" width="96" height="10" rx="4"/>
    </g>
