      <rect class="card" x="910" y="216" width="212" height="112" rx="8"/>
      <rect class="gold" x="930" y="240" width="6" height="22" rx="3"/>
      <rect class="txt2" x="948" y="244" width="120" height="12" rx="4"/>
      <rect class="gold" x="930" y="278" width="76" height="14" rx="4" opacity=".7"/>
      <rect class="txt" x="930" y="306" width="132" height="10" rx="4"/>
      <rect class="card" x="910" y="346" width="212" height="112" rx="8"/>
      <rect class="txt2" x="930" y="374" width="108" height="12" rx="4"/>
      <rect class="gold" x="930" y="408" width="62" height="14" rx="4" opacity=".7"/>
